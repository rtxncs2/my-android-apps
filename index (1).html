<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Index of /downloads</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Index of Android Apps</h1>



<p>Use the search box below to quickly find an app by name.</p>

<div class="toolbar">
  <input type="search" id="search" placeholder="Search apps..." aria-label="Search apps" autocomplete="off">
  <span id="count"></span>
</div>

<table id="indexlist">
  <thead>
    <tr class="indexhead">
      <th class="col-icon"></th>
      <th class="col-name">Name</th>
      <th class="col-dl">Download</th>
    </tr>
    <tr class="indexbreakrow"><th colspan="3"><hr></th></tr>
  </thead>
  <tbody id="list"></tbody>
  <tfoot>
    <tr class="indexbreakrow"><th colspan="3"><hr></th></tr>
  </tfoot>
</table>

<p id="empty" class="empty" hidden>No apps match your search.</p>

<script src="script.js"></script>
</body>
</html>
